# Kept deliberately in step with idunn's own .golangci.yml: a sidecar that lints
# to a laxer standard than the library it fronts would be the wrong half of the
# system to relax.
version: "2"

linters:
  enable:
    - bodyclose
    - errorlint     # errors must stay classifiable (the Reporter taxonomy)
    - gosec
    - misspell
    - nilerr        # returning nil after a non-nil error = fail open
    - noctx
    - revive
    - unconvert
    - unparam

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank stays off: `_ = f.Close()` on a cleanup path is the explicit,
      # greppable form of "this error is deliberately dropped". Forcing a
      # //nolint on each one would hide the same decision behind a directive.
      check-blank: false
    gosec:
      excludes:
        - G304 # destination paths are sanitized with core/stage.SanitizeDst
    revive:
      rules:
        - name: exported
        - name: unused-parameter

  exclusions:
    rules:
      # Test-only helpers may take shortcuts production code may not.
      - path: _test\.go
        linters: [gosec, errcheck, unparam]
      # testdata/fakepacker is a stand-in binary compiled by a test. It is not
      # shipped and never reads anything a real packer would.
      - path: testdata/
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
