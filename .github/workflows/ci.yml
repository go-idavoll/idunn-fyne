name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# go.mod pins the LANGUAGE version (the oldest Go this module supports), not the
# toolchain CI should build with. Build with the current stable patch.
env:
  GO_VERSION: stable

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Fyne is cgo: it needs the platform's GL and windowing headers. macOS and
      # Windows runners already carry theirs.
      - name: Linux GUI toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The window is driven through Fyne's test driver, which needs no display
      # and no GPU — but it is a real widget tree, so this is the build that
      # would catch a repaint touching a widget from the wrong goroutine.
      - name: Test (race)
        run: go test -race ./...

      - name: Formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "gofmt: $unformatted"; exit 1; }

      - name: Tidy go.mod
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
