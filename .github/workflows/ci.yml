name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# go.mod pins the LANGUAGE version (the oldest Go we support), not the toolchain
# CI should build with. Resolving `go-version-file: go.mod` installs exactly that
# patch release, which is by definition the oldest one and therefore carries every
# standard-library CVE fixed since -- govulncheck rightly fails on it. Build with
# the current stable patch instead.
env:
  GO_VERSION: stable

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Fyne is cgo: it needs the platform's GL and windowing headers. Only
      # ./cmd/... links the desktop driver, and only Linux needs the headers
      # spelled out: macOS and Windows drive their native APIs through the
      # toolchain the runner already has.
      - name: Native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The window is driven through Fyne's test driver, which needs no display
      # and no GPU -- but it is a real widget tree, so this is the build that
      # would catch a repaint touching a widget from the wrong goroutine.
      - name: Test (race)
        run: go test -race ./...

  # Coverage is measured once, on Linux, and scoped to the code that carries
  # tests and needs no driver. ./... as the coverage universe would count cmd/,
  # which is wiring: it opens a window and hands the widgets to a library
  # package, and pulling a display into CI to cover those few lines would buy
  # nothing. The root package is left out for a narrower reason -- its godoc
  # Example links fyne.io/fyne/v2/app, so it cannot build on a runner with no
  # OpenGL; the race job above covers it on all three platforms.
  coverage:
    name: coverage (adapter and assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # No native dependencies here on purpose: fyne.io/fyne/v2/test and the
      # widget packages link no driver, so this job proves the library half
      # builds and tests on a machine with no OpenGL and no display.
      - name: fyne/v2/app is confined to cmd/
        run: make no-app-import

      - name: Test with coverage
        run: |
          go test -covermode=atomic \
            -coverpkg=./fyneui/...,./internal/... \
            -coverprofile=coverage.out ./fyneui/... ./internal/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  static:
    name: gofmt + tidy + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # fyne.io/fyne/v2/app may be imported only from cmd/. That single rule is
      # what keeps the library half testable on a machine with no OpenGL, which
      # the coverage job above relies on.
      - name: fyne/v2/app is confined to cmd/
        run: make no-app-import

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Installed from source rather than via the action: the action's pinned
      # binary is built with an older Go than go.mod targets, which makes it
      # refuse the config outright.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
